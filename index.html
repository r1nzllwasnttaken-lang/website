<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rinzale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: auto;
    }

    * {
      cursor: auto;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: var(--bg);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      padding: 2rem 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: startupFade 0.8s ease-out 0.3s forwards;
    }

    @keyframes startupFade {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(180, 0, 0, 0.5);
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: rgba(255,255,255,0.3);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 0 12px rgba(200, 0, 0, 0.6),
        0 0 30px rgba(180, 0, 0, 0.35),
        0 0 60px rgba(150, 0, 0, 0.2);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow:
          0 0 12px rgba(200, 0, 0, 0.6),
          0 0 30px rgba(180, 0, 0, 0.35),
          0 0 60px rgba(150, 0, 0, 0.2);
        border-color: rgba(180, 0, 0, 0.5);
      }
      50% {
        box-shadow:
          0 0 18px rgba(220, 0, 0, 0.8),
          0 0 45px rgba(180, 0, 0, 0.5),
          0 0 80px rgba(150, 0, 0, 0.3);
        border-color: rgba(220, 0, 0, 0.75);
      }
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-inner { font-size: 38px; }

    .profile-card {
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      width: 320px;
      margin-bottom: 12px;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .profile-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 0, 0, 0.5);
      box-shadow: 0 0 20px rgba(200, 0, 0, 0.4);
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .profile-id {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-weight: 500;
    }

    .discord-presence {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      width: 320px;
      margin-bottom: 12px;
    }

    .dp-avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .dp-status-above {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #747f8d;
    }

    .dp-status-above.online { background: #3ba55d; }
    .dp-status-above.idle { background: #faa81a; }
    .dp-status-above.dnd { background: #ed4245; }
    .dp-status-above.offline { background: #747f8d; }

    .dp-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .dp-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dp-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dp-name {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dp-name span {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .dp-badges {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dp-badge {
      width: 16px;
      height: 16px;
    }

    .dp-activity {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .bio {
      font-size: 12.5px;
      color: rgba(255,255,255,0.38);
      text-align: center;
      line-height: 1.65;
      max-width: 260px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 200px;
      margin-top: 8px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 9px 12px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
      font-family: 'Inter', sans-serif;
      width: 100%;
      letter-spacing: 0.2px;
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.06), inset 0 0 12px rgba(255,255,255,0.03);
    }

    .link-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.2s, filter 0.2s;
    }

    .link-btn:hover svg {
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
    }

    .discord-btn:hover {
      border-color: rgba(88, 101, 242, 0.5);
      box-shadow: 0 0 18px rgba(88, 101, 242, 0.12), inset 0 0 12px rgba(88, 101, 242, 0.05);
    }

    .discord-btn:hover svg {
      filter: drop-shadow(0 0 5px rgba(88, 101, 242, 0.8));
    }

    .youtube-btn:hover {
      border-color: rgba(255, 0, 0, 0.4);
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.1), inset 0 0 12px rgba(255, 0, 0, 0.04);
    }

    .youtube-btn:hover svg {
      filter: drop-shadow(0 0 5px rgba(255, 60, 60, 0.8));
    }

    .enter-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    .enter-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .enter-pulse {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 14px;
      animation: enter-ring 2s ease-in-out infinite;
    }

    @keyframes enter-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.12); }
      50% { box-shadow: 0 0 0 12px rgba(255,255,255,0); }
    }

    .enter-text {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .now-playing {
      width: 200px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 9px 13px;
      position: relative;
    }

    .skip-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      padding: 4px 8px;
      transition: all 0.2s;
    }

    .skip-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.9);
    }

    .np-icon {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      flex-shrink: 0;
      animation: np-bounce 1.4s ease-in-out infinite;
    }

    @keyframes np-bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .np-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .np-label {
      font-size: 8.5px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.9px;
      text-transform: uppercase;
    }

    .np-title {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-artist {
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="enter-overlay" id="enterOverlay">
    <div class="enter-pulse">♪</div>
    <span class="enter-text">click to enter</span>
  </div>

  <div class="video-bg" id="bg"></div>

  <div class="overlay"></div>

  <div class="content">

    <!-- Main Profile Card -->
    <div class="profile-card">
      <div class="profile-main">
        <div class="profile-avatar">
          <img src="pfp.jpg" alt="pfp">
        </div>
      </div>
    </div>

    <!-- Discord Presence Card -->
    <div class="discord-presence" id="discordPresence">
      <div class="dp-avatar-container">
        <div class="dp-status-above" id="dpStatusAbove"></div>
        <div class="dp-avatar">
          <img id="dpAvatar" src="pfp.jpg" alt="discord avatar">
        </div>
      </div>
      <div class="dp-info">
        <div class="dp-name">
          <span id="dpUsername">rinzale</span>
          <div class="dp-badges" id="dpBadges"></div>
        </div>
        <div class="dp-activity" id="dpActivity">Loading...</div>
      </div>
    </div>

    <!-- Links -->
    <div class="links">
      <a class="link-btn discord-btn" href="https://discord.gg/t28py6fx" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        <span>Discord</span>
      </a>
      <a class="link-btn youtube-btn" href="https://youtube.com/@rinzale" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>YouTube</span>
      </a>
    </div>

    <div class="now-playing" id="nowPlaying">
      <span class="np-icon">♪</span>
      <div class="np-info">
        <span class="np-label" id="npLabel">now playing</span>
        <span class="np-title" id="npTitle">—</span>
        <span class="np-artist" id="npArtist">—</span>
      </div>
      <button class="skip-btn" id="skipBtn">⏭</button>
    </div>

  </div>

  <audio id="audio-player" style="display:none;"></audio>

  <script>
    var audio = document.getElementById('audio-player');
    var audioReady = false;
    var currentSongIndex = -1;
    
    var songs = [
      { file: 'song.mp3', title: '4 Wheeler', artist: 'Yuno Miles' },
      { file: 'song1.mp3', title: 'Fast Rap', artist: 'Yuno Miles' },
      { file: 'song2.mp3', title: '4 Big Guys', artist: 'Digbar' },
      { file: 'song3.mp3', title: 'Big Dick Randy', artist: 'Digbar' },
      { file: 'song4.mp3', title: 'Big Dick Randy 2', artist: 'Digbar' },
      { file: 'song5.mp3', title: 'Subway Sexists V2', artist: 'Subway Sexists' },
      { file: 'song6.mp3', title: 'Bricked', artist: 'Digbar' }
    ];
    
    function pickRandomSong() {
      var newIndex;
      do {
        newIndex = Math.floor(Math.random() * songs.length);
      } while (newIndex === currentSongIndex && songs.length > 1);
      return newIndex;
    }
    
    function loadSong(index) {
      currentSongIndex = index;
      audio.src = songs[index].file;
      audio.load();
      document.getElementById('npTitle').textContent = songs[index].title;
      document.getElementById('npArtist').textContent = songs[index].artist;
    }
    
    function playNextSong() {
      var nextIndex = pickRandomSong();
      loadSong(nextIndex);
      audio.play().catch(function(err) {
        console.error('Audio play error:', err);
      });
    }
    
    // Pick initial random song
    loadSong(pickRandomSong());
    audio.volume = 0.5;
    
    audio.addEventListener('canplaythrough', function() {
      audioReady = true;
      console.log('Audio ready');
    });
    
    // Play next random song when current ends
    audio.addEventListener('ended', function() {
      console.log('Song ended, playing next');
      playNextSong();
    });

    document.getElementById('enterOverlay').addEventListener('click', function() {
      var overlay = document.getElementById('enterOverlay');
      overlay.classList.add('hidden');
      
      if (audioReady) {
        audio.play().catch(function(err) {
          console.error('Audio play error:', err);
        });
        console.log('Playing audio');
      } else {
        var checkReady = setInterval(function() {
          if (audioReady) {
            clearInterval(checkReady);
            audio.play().catch(function(err) {
              console.error('Audio play error:', err);
            });
            console.log('Playing audio after ready check');
          }
        }, 100);
      }
    });

    document.getElementById('skipBtn').addEventListener('click', function() {
      console.log('Skipping song');
      playNextSong();
    });

    // Lanyard Discord Presence
    const DISCORD_USER_ID = '1359512951693906053';
    
    async function fetchDiscordPresence() {
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const data = await response.json();
        
        if (data.success) {
          updateDiscordPresence(data.data);
        }
      } catch (err) {
        console.error('Failed to fetch Discord presence:', err);
      }
    }
    
    function updateDiscordPresence(data) {
      // Update avatar
      const avatarUrl = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png`;
      document.getElementById('dpAvatar').src = avatarUrl;
      
      // Update username
      document.getElementById('dpUsername').textContent = data.discord_user.username;
      
      // Update status indicator
      const statusEl = document.getElementById('dpStatusAbove');
      statusEl.className = 'dp-status-above ' + data.discord_status;
      
      // Update badges
      const badgesEl = document.getElementById('dpBadges');
      if (data.discord_user.public_flags || data.discord_user.flags) {
        const flags = data.discord_user.public_flags || data.discord_user.flags;
        badgesEl.innerHTML = getBadgesHTML(flags);
      } else {
        badgesEl.innerHTML = '';
      }
      
      // Update activity
      const activityEl = document.getElementById('dpActivity');
      if (data.activities && data.activities.length > 0) {
        const activity = data.activities[0];
        if (activity.type === 0) {
          activityEl.textContent = 'Playing ' + activity.name;
        } else if (activity.type === 2) {
          activityEl.textContent = 'Listening to ' + activity.name;
        } else if (activity.type === 4) {
          activityEl.textContent = activity.state || activity.name;
        } else {
          activityEl.textContent = activity.name;
        }
      } else {
        activityEl.textContent = data.discord_status === 'online' ? 'Online' : 
                                 data.discord_status === 'idle' ? 'Away' :
                                 data.discord_status === 'dnd' ? 'Do Not Disturb' : 'Offline';
      }
    }
    
    // Badge icons (Discord public flags)
    const BADGE_ICONS = {
      1: { name: 'Staff', icon: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5', color: '#40e0d0' },
      2: { name: 'Partner', icon: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z', color: '#f8c300' },
      4: { name: 'HypeSquad', icon: 'M12 2L4 7v10l8 5 8-5V7l-8-5zm0 2.5L18 8v8l-6 3.75L6 16V8l6-3.5z', color: '#f47fff' },
      8: { name: 'Bug Hunter', icon: 'M12 2c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z', color: '#f8c300' },
      64: { name: 'HypeSquad Bravery', icon: 'M12 2L2 22h20L12 2zm0 4l7 12H5l7-12z', color: '#9c8ff7' },
      128: { name: 'HypeSquad Brilliance', icon: 'M12 2L2 22h20L12 2zm0 4l7 12H5l7-12z', color: '#f47fff' },
      256: { name: 'HypeSquad Balance', icon: 'M12 2L2 22h20L12 2zm0 4l7 12H5l7-12z', color: '#45ddbc' },
      512: { name: 'Early Supporter', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z', color: '#0f7ec6' },
      16384: { name: 'Verified Bot Dev', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z', color: '#3ba55d' },
      4194304: { name: 'Active Developer', icon: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5', color: '#3ba55d' }
    };
    
    function getBadgesHTML(flags) {
      let html = '';
      for (const [flag, badge] of Object.entries(BADGE_ICONS)) {
        if (flags & parseInt(flag)) {
          html += `<svg class="dp-badge" viewBox="0 0 24 24" fill="${badge.color}" title="${badge.name}"><path d="${badge.icon}"/></svg>`;
        }
      }
      return html;
    }

    // Fetch initially and then every 30 seconds
    fetchDiscordPresence();
    setInterval(fetchDiscordPresence, 30000);

  </script>

  <style>:root { --bg: url("bg.jpg"); }</style>
</body>
</html>
