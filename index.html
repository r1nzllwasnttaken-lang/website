    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: var(--bg);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      padding: 2rem 1.5rem;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(180, 0, 0, 0.5);
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: rgba(255,255,255,0.3);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow:
        0 0 12px rgba(200, 0, 0, 0.6),
        0 0 30px rgba(180, 0, 0, 0.35),
        0 0 60px rgba(150, 0, 0, 0.2);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow:
          0 0 12px rgba(200, 0, 0, 0.6),
          0 0 30px rgba(180, 0, 0, 0.35),
          0 0 60px rgba(150, 0, 0, 0.2);
        border-color: rgba(180, 0, 0, 0.5);
      }
      50% {
        box-shadow:
          0 0 18px rgba(220, 0, 0, 0.8),
          0 0 45px rgba(180, 0, 0, 0.5),
          0 0 80px rgba(150, 0, 0, 0.3);
        border-color: rgba(220, 0, 0, 0.75);
      }
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-inner { font-size: 38px; }

    .username {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.4px;
      text-shadow: 0 0 30px rgba(255,255,255,0.25);
    }

    .bio {
      font-size: 12.5px;
      color: rgba(255,255,255,0.38);
      text-align: center;
      line-height: 1.65;
      max-width: 260px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 200px;
      margin-top: 8px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 9px 12px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
      font-family: 'Inter', sans-serif;
      width: 100%;
      letter-spacing: 0.2px;
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.06), inset 0 0 12px rgba(255,255,255,0.03);
    }

    .link-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.2s, filter 0.2s;
    }

    .link-btn:hover svg {
      opacity: 0.9;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
    }

    .discord-btn:hover {
      border-color: rgba(88, 101, 242, 0.5);
      box-shadow: 0 0 18px rgba(88, 101, 242, 0.12), inset 0 0 12px rgba(88, 101, 242, 0.05);
    }

    .discord-btn:hover svg {
      filter: drop-shadow(0 0 5px rgba(88, 101, 242, 0.8));
    }

    .youtube-btn:hover {
      border-color: rgba(255, 0, 0, 0.4);
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.1), inset 0 0 12px rgba(255, 0, 0, 0.04);
    }

    .youtube-btn:hover svg {

            console.log('Playing audio after ready check');
